name: Validate and publish release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate shell scripts and port-forward policy
        run: |
          set -euo pipefail
          bash -n install.sh port-forward.sh tests/test-port-forward.sh
          bash tests/test-port-forward.sh
          grep -F 'PORT_HELPER_URL="https://raw.githubusercontent.com/AmiRaiZo/MIKROTIK/e5ec4313dbfb8f584a32777c2e197b9e9177ae10/port-forward.sh"' install.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "MikroTik $tag" \
            --notes-file RELEASE_NOTES.md
